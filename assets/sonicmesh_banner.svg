<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0C1425"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 12px; opacity: 0.9; stroke-width: 2.5; }
      50% { r: 48px; opacity: 0.5; stroke-width: 1.5; }
      100% { r: 85px; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes pulseRing2 {
      0% { r: 12px; opacity: 0; stroke-width: 2; }
      25% { opacity: 0.8; }
      75% { r: 65px; opacity: 0.3; stroke-width: 1.2; }
      100% { r: 95px; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-480px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(-480px); }
      100% { transform: translateX(0); }
    }
    @keyframes floatPhone {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes packetFlow {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(320px, 0); opacity: 0; }
    }
    .ring1 { animation: pulseRing 3s ease-out infinite; transform-origin: 155px 145px; }
    .ring2 { animation: pulseRing2 3s ease-out infinite 1.2s; transform-origin: 155px 145px; }
    .wave1 { animation: waveMove1 12s linear infinite; }
    .wave2 { animation: waveMove2 16s linear infinite; }
    .beacon { animation: beaconBlink 2s ease-in-out infinite; }
    .phone { animation: floatPhone 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="300" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle High-tech Grid Background -->
  <g stroke="#1E293B" stroke-opacity="0.35" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="440" y1="0" x2="440" y2="300"/>
    <line x1="520" y1="0" x2="520" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="680" y1="0" x2="680" y2="300"/>
    <line x1="760" y1="0" x2="760" y2="300"/>
    <line x1="840" y1="0" x2="840" y2="300"/>
    <line x1="920" y1="0" x2="920" y2="300"/>
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
  </g>

  <!-- Animated FSK Acoustic Waveform in Background -->
  <g opacity="0.35" style="transform: translateY(220px);">
    <g class="wave1">
      <path d="M0,0 Q 30,-25 60,0 T 120,0 T 180,0 T 240,0 T 300,0 T 360,0 T 420,0 T 480,0 T 540,0 T 600,0 T 660,0 T 720,0 T 780,0 T 840,0 T 900,0 T 960,0 T 1020,0 T 1080,0 T 1140,0 T 1200,0 T 1260,0 T 1320,0 T 1380,0 T 1440,0" fill="none" stroke="url(#waveGrad1)" stroke-width="2.5" filter="url(#softGlow)"/>
    </g>
    <g class="wave2" style="transform: translateY(-8px);">
      <path d="M0,0 Q 20,-18 40,0 T 80,0 T 120,0 T 160,0 T 200,0 T 240,0 T 280,0 T 320,0 T 360,0 T 400,0 T 440,0 T 480,0 T 520,0 T 560,0 T 600,0 T 640,0 T 680,0 T 720,0 T 760,0 T 800,0 T 840,0 T 880,0 T 920,0 T 960,0 T 1000,0 T 1040,0 T 1080,0 T 1120,0 T 1160,0 T 1200,0 T 1240,0 T 1280,0 T 1320,0 T 1360,0 T 1400,0 T 1440,0" fill="none" stroke="url(#waveGrad2)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Pulsing Acoustic Radar Rings (Left Emitter) -->
  <g>
    <circle cx="155" cy="145" r="100" fill="url(#beaconGlow)"/>
    <circle class="ring1" cx="155" cy="145" r="12" fill="none" stroke="#00F5FF"/>
    <circle class="ring2" cx="155" cy="145" r="12" fill="none" stroke="#10B981"/>
  </g>

  <!-- Left Broadcaster Phone Graphic -->
  <g class="phone" transform="translate(130, 100)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="50" height="90" rx="9" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="5" y="10" width="40" height="70" rx="4" fill="#020617"/>
    <!-- Speaker & Mic lines -->
    <line x1="20" y1="5" x2="30" y2="5" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="25" cy="84" r="1.5" fill="#64748B"/>
    <!-- Screen Elements: Soundwaves -->
    <path d="M 12,45 Q 18,35 25,45 T 38,45" fill="none" stroke="#00F5FF" stroke-width="2"/>
    <circle cx="25" cy="45" r="3" fill="#10B981"/>
    <!-- Speaker Sound Waves Emitting Outward -->
    <path d="M 55,30 A 25 25 0 0 1 55,60" fill="none" stroke="#00F5FF" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 63,22 A 38 38 0 0 1 63,68" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 72,14 A 52 52 0 0 1 72,76" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Center-Right Branding Content -->
  <g transform="translate(260, 0)">
    <!-- Offline Mesh Badge -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="230" height="26" rx="13" fill="#032B2B" stroke="#0D9488" stroke-width="1"/>
      <circle class="beacon" cx="14" cy="13" r="4.5" fill="#00F5FF"/>
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF" letter-spacing="1.2">OFFLINE ACOUSTIC MESH</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#cyanGlow)" filter="url(#glow)" letter-spacing="2">SONICMESH</text>

    <!-- Tagline -->
    <text x="2" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">
      Turn the air into the network.
    </text>

    <!-- Description -->
    <text x="2" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Infrastructure-free one-to-many acoustic communication for Android.
    </text>
    <text x="2" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B">
      No Wi-Fi • No Bluetooth • No Cellular • No Cloud • 100% Offline via Audio FSK
    </text>

    <!-- Mini Feature Badges -->
    <g transform="translate(2, 218)">
      <rect x="0" y="0" width="105" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="10" y="15" font-family="monospace" font-size="10.5" fill="#38BDF8">FSK MODULATION</text>

      <rect x="115" y="0" width="100" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="125" y="15" font-family="monospace" font-size="10.5" fill="#10B981">CRC32 + FEC</text>

      <rect x="225" y="0" width="118" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="235" y="15" font-family="monospace" font-size="10.5" fill="#C084FC">MULTI-HOP RELAY</text>

      <rect x="353" y="0" width="102" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="363" y="15" font-family="monospace" font-size="10.5" fill="#F59E0B">AIR-GAPPED ACK</text>
    </g>
  </g>

  <!-- Right Receiver Phone Icons -->
  <g transform="translate(810, 80)">
    <!-- Rx Phone 1 -->
    <g class="phone" style="animation-delay: 0.5s;">
      <rect x="0" y="0" width="36" height="64" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5" filter="url(#softGlow)"/>
      <rect x="4" y="8" width="28" height="48" rx="3" fill="#020617"/>
      <circle cx="18" cy="32" r="6" fill="#065F46"/>
      <path d="M 15 32 L 17 34 L 22 29" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="78" font-family="monospace" font-size="9" fill="#10B981" text-anchor="middle">Rx #1</text>
    </g>

    <!-- Rx Phone 2 -->
    <g class="phone" transform="translate(60, 45)" style="animation-delay: 1.2s;">
      <rect x="0" y="0" width="36" height="64" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" filter="url(#softGlow)"/>
      <rect x="4" y="8" width="28" height="48" rx="3" fill="#020617"/>
      <circle cx="18" cy="32" r="6" fill="#0C4A6E"/>
      <path d="M 15 32 L 17 34 L 22 29" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="78" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="middle">Rx #2</text>
    </g>
  </g>
</svg>
